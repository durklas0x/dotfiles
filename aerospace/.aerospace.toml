config-version = 2

start-at-login = true
auto-reload-config = true
default-root-container-layout = 'tiles'
on-focused-monitor-changed = 'move-mouse monitor-lazy-center'
on-focus-changed = 'move-mouse window-lazy-center'
focus-follows-mouse.enabled = true
gaps.inner.horizontal = 4
gaps.inner.vertical = 4

on-window-detected = [
    { if.app-id = 'com.spotify.client', run = 'layout floating' },
    { if.app-id = 'com.apple.Terminal', run = 'layout floating' },
]

[mode.main.binding]
alt-semicolon = 'focus left'
alt-slash = 'focus down'
alt-leftSquareBracket = 'focus up'
alt-quote = 'focus right'

alt-shift-semicolon = 'move left'
alt-shift-slash = 'move down'
alt-shift-leftSquareBracket = 'move up'
alt-shift-quote = 'move right'

alt-shift-f = 'layout floating tiling'

alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

alt-shift-s = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-semicolon = ['join-with left', 'mode main']
alt-shift-slash = ['join-with down', 'mode main']
alt-shift-leftSquareBracket = ['join-with up', 'mode main']
alt-shift-quote = ['join-with right', 'mode main']
