[bar.default]
background_opacity = 0.7
center = []
concave_edge_corners = false
end = [ "control-center", "clock" ]
margin_ends = 0
radius = 0
start = [ "launcher", "active_window" ]

[calendar]

[control_center.calendar]
show_events_card = false

[dock]
background_opacity = 0.7
concave_edge_corners = false
cross_axis_padding = 4
enabled = true
icon_size = 24
item_spacing = 4
main_axis_padding = 8
margin_edge = 0
pinned = [ "org.kde.dolphin", "zen", "com.mitchellh.ghostty", "discord" ]
radius = 0
radius_bottom_left = 0
radius_bottom_right = 0
radius_top_left = 0
radius_top_right = 0
reserve_space = false
show_dots = true
smart_auto_hide = true

[location]
auto_locate = true

[lockscreen]
blurred_desktop = true
transition = [ "wipe" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@STREAM", "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 0.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 0.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@STREAM"]
    box_height = 196.0
    box_width = 810.0
    cx = 480.0
    cy = 358.0
    output = "STREAM"
    placement_height = 540.0
    placement_width = 960.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@STREAM".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 0.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 0.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."noctalia/screen_recorder"]
copy_to_clipboard = true
directory = "/run/user/1000"
filename_pattern = "noctalia-recording"
resolution = "2560x1440"

[plugins]
enabled = [ "noctalia/screen_recorder" ]

[shell]
corner_radius_scale = 0.0
font_family = "Adwaita Mono"
polkit_agent = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    categories = false

    [shell.panel]
    open_near_click_control_center = true

    [shell.screenshot]
    copy_to_clipboard = true
    save_to_file = false

    [shell.window_switcher]
    mru = true
    show_count = false

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "muted"

    [theme.templates]
    builtin_ids = [ "ghostty", "hyprland" ]

[wallpaper]
directory = "/home/martynas/Downloads"

    [wallpaper.default]
    path = "/home/martynas/Downloads/pexels-alena-beliaeva-78160053-9501393.jpg"

    [wallpaper.last]
    path = "/home/martynas/Downloads/pexels-alena-beliaeva-78160053-9501393.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/martynas/Downloads/pexels-alena-beliaeva-78160053-9501393.jpg"

    [wallpaper.monitors.STREAM]
    path = "/home/martynas/Downloads/pexels-alena-beliaeva-78160053-9501393.jpg"
