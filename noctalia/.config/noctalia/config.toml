[bar.default]
background_opacity = 0.7
center = []
concave_edge_corners = false
end = [ "control-center", "clock" ]
margin_ends = 0
radius = 0
start = [ "launcher", "active_window" ]

[calendar]

[control_center.calendar]
show_events_card = false

[dock]
background_opacity = 0.7
concave_edge_corners = false
enabled = true
icon_size = 32
margin_edge = 12
pinned = [ "zen", "com.mitchellh.ghostty", "discord" ]
reserve_space = false
show_dots = true
smart_auto_hide = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@STREAM", "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
