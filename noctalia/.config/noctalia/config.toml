[shell]
font_family = "Adwaita Mono"
polkit_agent = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    categories = false

    [shell.panel]
    open_near_click_control_center = true

    [shell.window_switcher]
    mru = true
    show_count = false

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "ghostty", "hyprland" ]

[wallpaper]
directory = "/home/martynas/Downloads"

    [wallpaper.default]
    path = "/home/martynas/Downloads/Paint.jpeg"

    [wallpaper.last]
    path = "/home/martynas/Downloads/Paint.jpeg"

    [wallpaper.monitors.DP-1]
    path = "/home/martynas/Downloads/Paint.jpeg"
